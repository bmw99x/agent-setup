.list { display: flex; flex-direction: column }

<script>
const VIEWS = __VIEWS__;
let walkLoaded = false;
function show() {
  const name = VIEWS.includes(location.hash.slice(1)) ? location.hash.slice(1) : VIEWS[0];
  for (const v of VIEWS) document.getElementById("p-" + v).hidden = v !== name;
  document.querySelectorAll("nav a").forEach(a => { if (a.getAttribute("href") === "#" + name) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current"); });
  const src = document.getElementById("archify-src");
  if (name === "walkthrough" && src && !walkLoaded) {
    const bytes = Uint8Array.from(atob(src.textContent.trim()), c => c.charCodeAt(0));
    document.getElementById("walk-frame").srcdoc = new TextDecoder().decode(bytes);
    walkLoaded = true;
  }
}
window.addEventListener("hashchange", show);
show();
</script>

<script>
const GRAPH = __GRAPH__;
const SOURCE_URL = __SOURCE_URL__; // prefix joined with a node's repo path, "" for no links
const byId = new Map(GRAPH.nodes.map(n => [n.id, n]));
const $ = id => document.getElementById(id);
const short = id => id;
const pathOf = n => n.path;
const opts = { refs: true, classes: true };
let out, inn;

function rebuild() {
  out = new Map(); inn = new Map();
  for (const n of GRAPH.nodes) { out.set(n.id, []); inn.set(n.id, []); }
  for (const e of GRAPH.edges) {
    if (!opts.refs && e.kind === "ref") continue;
    const a = byId.get(e.from), b = byId.get(e.to);
    if (!a || !b) continue;
    if (!opts.classes && (a.kind === "class" || b.kind === "class")) continue;
    out.get(e.from).push(e); inn.get(e.to).push(e);
  }
}
function reach(start, adj, key) {
  const depth = new Map([[start, 0]]), q = [start];
  while (q.length) { const id = q.shift(); for (const e of adj.get(id)) { const nx = e[key]; if (!depth.has(nx)) { depth.set(nx, depth.get(id) + 1); q.push(nx); } } }
  depth.delete(start); return depth;
}
const upOf = id => reach(id, inn, "from"), downOf = id => reach(id, out, "to");

function listButtons(el, rows) {
  el.replaceChildren(...rows.map(([id, n]) => { const b = document.createElement("button"); b.title = short(id);
    b.innerHTML = `<span>${byId.get(id).name}</span><span class="n">${n}</span>`; b.onclick = () => select(id); return b; }));
}
function sidebar() {
  listButtons($("entries"), GRAPH.nodes.filter(n => n.entry).map(n => [n.id, downOf(n.id).size]));
  const fan = GRAPH.nodes.filter(n => opts.classes || n.kind !== "class").map(n => [n.id, inn.get(n.id).length]).sort((a, b) => b[1] - a[1]).slice(0, 12);
  listButtons($("fanin"), fan);
  const rip = GRAPH.nodes.filter(n => n.kind !== "class" && !n.entry).map(n => [n.id, upOf(n.id).size]).sort((a, b) => b[1] - a[1]).slice(0, 12);
  listButtons($("ripple-top"), rip);
  $("totals").textContent = `${GRAPH.nodes.length} symbols · ${GRAPH.edges.length} edges, static analysis`;
}

function table(el, depths, color) {
  if (!depths.size) { el.innerHTML = `<p class="empty">Nothing in the package.</p>`; return; }
  const rows = [...depths].sort((a, b) => a[1] - b[1] || a[0].localeCompare(b[0]));
  const t = document.createElement("table");
  t.innerHTML = `<thead><tr><th>hop</th><th>symbol</th><th>module</th></tr></thead>`;
  const tb = document.createElement("tbody");
  for (const [id, d] of rows) { const n = byId.get(id); const tr = document.createElement("tr");
    tr.innerHTML = `<td class="d" style="color:${color}">${d}</td><td></td><td class="mono" style="color:var(--muted)">${n.module}</td>`;
    const b = document.createElement("button"); b.textContent = n.name; b.title = n.doc || short(id); b.onclick = () => select(id); tr.children[1].append(b); tb.append(tr); }
  t.append(tb); el.replaceChildren(t);
}

const esc = s => s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
function select(id) {
  const n = byId.get(id); if (!n) return;
  const up = upOf(id), down = downOf(id);
  const entries = [...up.keys()].filter(k => byId.get(k).entry).map(k => byId.get(k).name);
  const mods = new Set([...up.keys()].map(k => byId.get(k).module));
  $("sel").innerHTML = `<span class="chip">${n.kind}</span>
    <div class="sel-name">${esc(n.name)}</div>
    <div class="meta"><span class="mono">${esc(short(id))}</span>${SOURCE_URL ? `<a href="${SOURCE_URL}${pathOf(n)}#L${n.line}" target="_blank" rel="noopener">${pathOf(n)}:${n.line}</a>` : `<span class="mono">${pathOf(n)}:${n.line}</span>`}<span>${n.loc} lines</span></div>
    ${n.doc ? `<p class="doc">${esc(n.doc)}</p>` : ""}
    <div class="stats">
      <div class="stat caller"><b>${inn.get(id).length}</b><span>direct callers</span></div>
      <div class="stat caller"><b>${up.size}</b><span>transitive dependants in ${mods.size} modules</span></div>
      <div class="stat callee"><b>${out.get(id).length}</b><span>direct callees</span></div>
      <div class="stat entry"><b>${entries.length}</b><span>${entries.length ? "commands reach it: " + entries.join(", ") : "commands reach it"}</span></div>
    </div>`;
  table($("up"), up, "var(--caller)"); table($("down"), down, "var(--callee)");
  draw(id);
  $("q").value = ""; $("results").hidden = true;
}

function draw(id) {
  const MAX = 12, W = 196, H = 26, GAPX = 44, GAPY = 8, PAD = 16;
  const ring = (start, adj, key) => { const d1 = [...new Set(adj.get(start).map(e => e[key]))].filter(x => x !== start);
    const d2 = [...new Set(d1.flatMap(x => adj.get(x).map(e => e[key])))].filter(x => x !== start && !d1.includes(x)); return [d1, d2]; };
  const [u1, u2] = ring(id, inn, "from"), [d1, d2] = ring(id, out, "to");
  const cols = [u2, u1, [id], d1, d2].map(c => ({ ids: c.slice(0, MAX), more: Math.max(0, c.length - MAX) }));
  const rows = Math.max(...cols.map(c => c.ids.length + (c.more ? 1 : 0)), 1);
  const width = PAD * 2 + 5 * W + 4 * GAPX, height = PAD * 2 + 22 + rows * (H + GAPY);
  const pos = new Map();
  cols.forEach((c, ci) => { const top = PAD + 22 + (rows - c.ids.length - (c.more ? 1 : 0)) * (H + GAPY) / 2;
    c.ids.forEach((nid, ri) => { if (!pos.has(nid) || ci === 2) pos.set(nid, { x: PAD + ci * (W + GAPX), y: top + ri * (H + GAPY), ci }); }); });
  const svg = $("graph"); svg.setAttribute("viewBox", `0 0 ${width} ${height}`); svg.setAttribute("width", width); svg.setAttribute("height", height);
  const heads = ["callers, 2 hops", "direct callers", "selected", "direct callees", "callees, 2 hops"];
  let s = heads.map((h, i) => `<text x="${PAD + i * (W + GAPX) + W / 2}" y="${PAD + 8}" text-anchor="middle" font-size="11" fill="var(--muted)" style="font-family:var(--sans)">${h}</text>`).join("");
  const edgeSet = [];
  for (const e of GRAPH.edges) { if (!out.get(e.from).includes(e)) continue; const a = pos.get(e.from), b = pos.get(e.to); if (!a || !b) continue;
    if (b.ci - a.ci === 1) edgeSet.push([a, b, e]); }
  for (const [a, b, e] of edgeSet) { const x1 = a.x + W, y1 = a.y + H / 2, x2 = b.x, y2 = b.y + H / 2, mx = (x1 + x2) / 2;
    const col = b.ci <= 2 ? "var(--caller)" : "var(--callee)";
    s += `<path d="M${x1} ${y1}C${mx} ${y1} ${mx} ${y2} ${x2} ${y2}" fill="none" stroke="${col}" stroke-opacity=".7" stroke-width="1.2" ${e.kind !== "call" || e.inferred ? 'stroke-dasharray="4 3"' : ""}/>`; }
  cols.forEach((c, ci) => { c.ids.forEach(nid => { const p = pos.get(nid); if (p.ci !== ci) return; const n = byId.get(nid);
      const fill = ci === 2 ? "var(--accent-soft)" : ci < 2 ? "var(--caller-soft)" : "var(--callee-soft)";
      const stroke = ci === 2 ? "var(--accent)" : ci < 2 ? "var(--caller)" : "var(--callee)";
      const label = n.name.length > 26 ? n.name.slice(0, 25) + "…" : n.name;
      s += `<g class="node" data-id="${nid}" style="cursor:pointer"><title>${esc(short(nid))}${n.doc ? "\n" + esc(n.doc) : ""}</title><rect x="${p.x}" y="${p.y}" width="${W}" height="${H}" rx="5" fill="${fill}" stroke="${stroke}" stroke-width="${ci === 2 ? 2 : 1}"/><text x="${p.x + 8}" y="${p.y + 17}" font-size="11.5" fill="var(--ink)">${esc(label)}</text></g>`; });
    if (c.more) { const y = PAD + 22 + (rows - c.ids.length - 1) * (H + GAPY) / 2 + c.ids.length * (H + GAPY);
      s += `<text x="${PAD + ci * (W + GAPX) + 8}" y="${y + 17}" font-size="11" fill="var(--muted)">+${c.more} more (see lists below)</text>`; } });
  svg.innerHTML = s;
  svg.querySelectorAll(".node").forEach(g => g.addEventListener("click", () => select(g.dataset.id)));

const q = $("q"), res = $("results");
q.addEventListener("input", () => {
  const term = q.value.trim().toLowerCase(); if (!term) { res.hidden = true; return; }
  const hits = GRAPH.nodes.filter(n => n.id.toLowerCase().includes(term)).sort((a, b) => (a.name.toLowerCase().startsWith(term) ? 0 : 1) - (b.name.toLowerCase().startsWith(term) ? 0 : 1) || a.name.length - b.name.length).slice(0, 30);
  res.replaceChildren(...hits.map(n => { const b = document.createElement("button"); b.innerHTML = `<span class="mono">${esc(n.name)}</span> <span class="sub">${n.module}</span>`; b.onclick = () => select(n.id); return b; }));

let current = __DEFAULT_SYMBOL__ || (GRAPH.nodes.find(n => n.entry) || GRAPH.nodes[0]).id;
const refresh = () => { rebuild(); sidebar(); select(current); };
$("opt-refs").addEventListener("change", e => { opts.refs = e.target.checked; refresh(); });
$("opt-classes").addEventListener("change", e => { opts.classes = e.target.checked; refresh(); });
const origSelect = select;
select = id => { current = id; origSelect(id); };
refresh();
</script>
