[project]
name = "shop"
version = "0.1.0"
requires-python = ">=3.12"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "unit: isolated tests with no DB, network or external services",
    "integration: tests that use a live DB, network or service fixture",
]
