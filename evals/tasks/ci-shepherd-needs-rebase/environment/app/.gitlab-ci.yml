image: python:3.12-slim

stages: [lint, test, build]

default:
  before_script:
    - pip install -q pytest==8.3.4 ruff==0.8.4

ruff:
  stage: lint
  script:
    - ruff check .

unit-tests:
  stage: test
  script:
    - pytest -q

package:
  stage: build
  script:
    - pip wheel --no-deps -w dist .
