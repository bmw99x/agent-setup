[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tidyhttp"
version = "1.3.0"
description = "A small, typed HTTP client."
requires-python = ">=3.9"
dependencies = ["chardetish>=2.0"]
license = {text = "MIT"}

[tool.setuptools]
packages = ["tidyhttp"]
