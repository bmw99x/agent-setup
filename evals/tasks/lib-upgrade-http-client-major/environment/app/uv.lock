version = 1
revision = 3
requires-python = ">=3.10"

[[package]]
name = "catalog-sync"
version = "0.7.0"
source = { virtual = "." }
dependencies = [
    { name = "tidyhttp" },
]

[package.metadata]
requires-dist = [{ name = "tidyhttp", specifier = ">=1.0,<3" }]

[[package]]
name = "chardetish"
version = "2.0.0"
source = { registry = "../opt/wheels" }
wheels = [
    { path = "chardetish-2.0.0-py3-none-any.whl" },
]

[[package]]
name = "tidyhttp"
version = "1.3.0"
source = { registry = "../opt/wheels" }
dependencies = [
    { name = "chardetish" },
]
wheels = [
    { path = "tidyhttp-1.3.0-py3-none-any.whl" },
]
