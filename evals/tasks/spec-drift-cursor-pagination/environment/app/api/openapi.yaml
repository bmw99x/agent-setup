openapi: 3.1.0
info:
  title: orders-service
  version: 1.4.0
paths:
  /orders:
    get:
      summary: List orders, newest first
      parameters:
        - name: page
          in: query
          description: 1-based page number.
          schema: {type: integer, minimum: 1, default: 1}
        - name: page_size
          in: query
          description: Orders per page.
          schema: {type: integer, minimum: 1, maximum: 200, default: 50}
      responses:
        "200":
          description: One page of orders.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/OrderPage"}
  /orders/{id}/cancel:
    post:
      summary: Cancel an order
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: The cancelled order.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Order"}
        "409":
          description: Order already cancelled.
components:
  schemas:
    Order:
      type: object
      required: [id, createdAt, total, status]
      properties:
        id: {type: string, format: uuid}
        createdAt: {type: string, format: date-time}
        total: {type: string}
        status: {type: string, enum: [placed, cancelled]}
    OrderPage:
      type: object
      required: [items, page, page_size, total, total_pages]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/Order"}
        page: {type: integer}
        page_size: {type: integer}
        total: {type: integer, description: Total number of orders across all pages.}
        total_pages: {type: integer}
